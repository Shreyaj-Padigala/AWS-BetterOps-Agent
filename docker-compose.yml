# Local development infrastructure for AWS BetterOps Agent.
#
# Phase 1 needs only `postgres`. The other services are declared now so the local
# environment matches the target AWS architecture as later phases land:
#
#   postgres    -> Amazon RDS for PostgreSQL (+ pgvector)
#   redis       -> Amazon ElastiCache for Redis
#   localstack  -> Amazon S3 + Amazon SQS         (Phases 7, 9)
#   worker      -> ECS worker service             (Phase 9)
#
# Start what the current phase needs:  docker compose up -d postgres redis

services:
  postgres:
    # pgvector is required from Phase 7; using the image now avoids a later swap.
    image: pgvector/pgvector:pg16
    container_name: betterops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betterops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d betterops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: betterops-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: betterops-localstack
    environment:
      SERVICES: s3,sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    profiles: ["phase9"]

  app:
    build: .
    container_name: betterops-app
    command: ["python", "app.py"]
    environment:
      APP_ENV: development
      FLASK_HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/betterops
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    # No Dockerfile until Phase 16; run the app on the host for now.
    profiles: ["containerized"]

  worker:
    build: .
    container_name: betterops-worker
    command: ["python", "-m", "workers.investigation_worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/betterops
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://localstack:4566
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["phase9"]

volumes:
  postgres-data:
