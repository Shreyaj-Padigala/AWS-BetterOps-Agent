<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AWS BetterOps Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('pages.dashboard_page') }}">
      <span class="brand-mark">BO</span>
      <span class="brand-text">AWS BetterOps Agent</span>
    </a>
    <nav class="topnav">
      <a href="{{ url_for('pages.dashboard_page') }}" data-nav="dashboard">Dashboard</a>
      <a href="{{ url_for('pages.projects_page') }}" data-nav="projects">Projects</a>
      <a href="{{ url_for('pages.incidents_page') }}" data-nav="incidents">Incidents</a>
    </nav>
    <div class="topbar-right">
      <span class="org-badge" id="org-badge"></span>
      <button class="btn btn-ghost" id="logout-button" type="button">Sign out</button>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
