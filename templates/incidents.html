{% extends "base.html" %}
{% block title %}Incidents · AWS BetterOps Agent{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Incidents</h1>
    <p class="subtitle">Every incident across your organization.</p>
  </div>
  <div class="filter-group">
    <label for="status-filter">Status</label>
    <select id="status-filter">
      <option value="OPEN_ONLY" selected>Open</option>
      <option value="">All</option>
      <option value="OPEN">Open (new)</option>
      <option value="INVESTIGATING">Investigating</option>
      <option value="MITIGATED">Mitigated</option>
      <option value="RESOLVED">Resolved</option>
      <option value="CLOSED">Closed</option>
    </select>
  </div>
</div>

<section class="panel">
  <div id="incident-list" class="loading">Loading…</div>
  <div class="pager" id="pager" hidden>
    <button class="btn btn-ghost" id="prev-page" type="button">Previous</button>
    <span id="page-info"></span>
    <button class="btn btn-ghost" id="next-page" type="button">Next</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/incident_table.js') }}"></script>
<script src="{{ url_for('static', filename='js/incidents.js') }}"></script>
{% endblock %}
